name: CI (Swift)

on:
  push:
    branches: ["swift", "release/swift*"]
  pull_request:
    branches: ["swift", "release/swift*"]

jobs:
  fmt:
    name: Swift, Go & Docs Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Check Go formatting
        run: |
          if [ -d tools ]; then
            UNFORMATTED=$(gofmt -l tools/)
            if [ -n "$UNFORMATTED" ]; then
              echo "The following Go files are not formatted:"
              echo "$UNFORMATTED"
              echo "Run 'gofmt -w tools/' to fix."
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Check Markdown formatting
        run: npx prettier --check "**/*.md"

  test:
    name: Please Build & Test (Swift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Cache Please & Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/please
          key: please-swift-6.0.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_defs/swift/**', 'tools/swift_toolchain/**') }}
          restore-keys: |
            please-swift-6.0.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Build all targets
        run: ./pleasew --plain_output build //tools/please_swift/... //tools/swift_toolchain/... //test/swift/...
        env:
          VERITAS_NO_HOOK: "1"

      - name: Run all tests
        run: ./pleasew --plain_output test //...
        env:
          VERITAS_NO_HOOK: "1"

      - name: Coverage smoke test (math_test)
        run: |
          ./pleasew --plain_output cover //test/swift/lib:math_test  2>&1 | tee cover.log
          grep -Eq '^\s+Math\.swift [1-9][0-9]*/' cover.log
        env:
          VERITAS_NO_HOOK: "1"

      - name: Coverage smoke test (mid_test, transitive dependencies)
        run: |
          ./pleasew --plain_output cover //test/swift/chain:mid_test  2>&1 | tee cover.log
          grep -Eq '^\s+Mid\.swift [1-9][0-9]*/' cover.log
          grep -Eq '^\s+Base\.swift [1-9][0-9]*/' cover.log
        env:
          VERITAS_NO_HOOK: "1"

      - name: Raw lcov export smoke test (functions and branches)
        run: |
          ./pleasew --plain_output cover //test/swift/branches:branches_test 2>&1 | tee cover.log
          f="plz-out/bin/test/swift/branches/branches_test.lcov"
          grep -q '^SF:test/swift/branches/Branches\.swift$' "$f"
          grep -Eq '^FNDA:0,.*unused' "$f"
          grep -q '^BRDA:4,0,1,0$' "$f"
          grep -q '^BRDA:12,0,0,0$' "$f"
        env:
          VERITAS_NO_HOOK: "1"
