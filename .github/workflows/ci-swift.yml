name: CI (Swift)

on:
  push:
    branches: ["swift", "release/swift*"]
  pull_request:
    branches: ["swift", "release/swift*"]

jobs:
  fmt:
    name: Swift, Go & Docs Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check formatting
        uses: ./.github/actions/format-check

  test:
    name: Please Build & Test (Swift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Cache Please & Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/please
          key: please-swift-6.0.3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_defs/swift/**', 'tools/swift_toolchain/**') }}
          restore-keys: |
            please-swift-6.0.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and test
        uses: ./.github/actions/please-build-test
        with:
          build-targets: //tools/please_swift/... //tools/swift_toolchain/... //test/swift/...

      - name: Coverage smoke test (math_test)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover //test/swift/lib:math_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck -coverage-json plz-out/log/coverage.json -covered test/swift/lib/Math.swift

      - name: Coverage smoke test (mid_test, transitive dependencies)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover //test/swift/chain:mid_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck -coverage-json plz-out/log/coverage.json \
            -covered test/swift/chain/Mid.swift -covered test/swift/chain/Base.swift

      - name: Raw lcov export smoke test (functions and branches)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover --rerun //test/swift/branches:branches_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck \
            -lcov plz-out/bin/test/swift/branches/branches_test.lcov \
            -path test/swift/branches/Branches.swift \
            -line 4=partial -line 12=partial -line 5=uncovered \
            -function unused=missed -function classify=2
