name: Release

on:
  push:
    tags:
      - "rust-v*"
      - "kotlin-v*"
      - "swift-v*"
      - "ts-v*"
      - "wit-v*"
  workflow_dispatch:
    inputs:
      language:
        description: "Language to release"
        required: true
        type: choice
        options:
          - rust
          - kotlin
          - swift
          - ts
          - wit
      version:
        description: "Version to release (e.g. 0.4.2)"
        required: true
        type: string
      dry_run:
        description:
          "Dry run (validate and build without committing, tagging, or
          publishing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Pre-Release Testing & Smoke Verification
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      language: ${{ steps.meta.outputs.language }}
      version: ${{ steps.meta.outputs.version }}
      tool: ${{ steps.meta.outputs.tool }}
      title: ${{ steps.meta.outputs.title }}
      target_branch: ${{ steps.meta.outputs.target_branch }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - name: Parse release metadata & options
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LANG: ${{ inputs.language }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            LANG="${INPUT_LANG}"
            RAW_VERSION="${INPUT_VERSION}"
            VERSION="${RAW_VERSION#v}"
            TAG="${LANG}-v${VERSION}"
            TARGET_BRANCH="${LANG}"
            CHECKOUT_REF="${LANG}"
            DRY_RUN="${INPUT_DRY_RUN:-false}"
          else
            TAG="${REF_NAME}"
            LANG="${TAG%%-v*}"
            RAW_VERSION="${TAG#*-v}"
            VERSION="${RAW_VERSION#v}"
            TARGET_BRANCH="${LANG}"
            CHECKOUT_REF="${REF}"
            DRY_RUN="false"
          fi

          TOOL="please_${LANG}"

          case "$LANG" in
            rust) TITLE="Rust" ;;
            kotlin) TITLE="Kotlin" ;;
            swift) TITLE="Swift" ;;
            ts) TITLE="TypeScript" ;;
            wit) TITLE="WIT" ;;
            *) TITLE="$(tr '[:lower:]' '[:upper:]' <<< "${LANG:0:1}")${LANG:1}" ;;
          esac

          echo "Detected release metadata:"
          echo "  Event:         ${EVENT_NAME}"
          echo "  Tag:           ${TAG}"
          echo "  Language:      ${LANG}"
          echo "  Version:       ${VERSION}"
          echo "  Tool:          ${TOOL}"
          echo "  Title:         ${TITLE}"
          echo "  Target Branch: ${TARGET_BRANCH}"
          echo "  Checkout Ref:  ${CHECKOUT_REF}"
          echo "  Dry Run:       ${DRY_RUN}"

          # Idempotency check for tag push: if release assets already exist, exit early
          if [ "${EVENT_NAME}" = "push" ]; then
            if gh release view "${TAG}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "${TOOL}-${VERSION}-linux_amd64"; then
              echo "Release assets for '${TAG}' are already published. Skipping workflow to avoid duplicate builds."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "language=${LANG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tool=${TOOL}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${CHECKOUT_REF}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.meta.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}
          fetch-depth: 0

      - name:
          Verify release tag does not already exist on remote
          (workflow_dispatch)
        if:
          steps.meta.outputs.skip != 'true' && github.event_name ==
          'workflow_dispatch' && steps.meta.outputs.dry_run != 'true'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "::error::Tag '${TAG}' already exists on remote. Cannot release an already existing version."
            exit 1
          fi

      - name: Verify tool directory exists
        if: steps.meta.outputs.skip != 'true'
        run: |
          TOOL="${{ steps.meta.outputs.tool }}"
          if [ ! -d "tools/${TOOL}" ]; then
            echo "::error::Tool directory 'tools/${TOOL}' does not exist for language '${{ steps.meta.outputs.language }}'."
            exit 1
          fi

      - name: Set up Go
        if: steps.meta.outputs.skip != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Pre-build test suite (Go unit tests)
        if: steps.meta.outputs.skip != 'true'
        run: |
          TOOL="${{ steps.meta.outputs.tool }}"
          echo "Running unit tests for ${TOOL}..."
          cd tools
          if [ ! -f go.mod ]; then
            printf "module tools\n\ngo 1.23\n" > go.mod
          fi
          go test -v ./${TOOL}/...
          if [ "${{ steps.meta.outputs.language }}" = "kotlin" ]; then
            go test -v ./please_kotlin_wasm/...
          fi

      - name: Pre-build test suite (Please tests)
        if: steps.meta.outputs.skip != 'true'
        run: |
          TOOL="${{ steps.meta.outputs.tool }}"
          echo "Running Please tests for //tools/${TOOL}/..."
          ./pleasew --plain_output test //tools/${TOOL}/...
        env:
          VERITAS_NO_HOOK: "1"

      - name: Binary smoke test & sanity check (runner-native linux_amd64)
        if: steps.meta.outputs.skip != 'true'
        run: |
          TOOL="${{ steps.meta.outputs.tool }}"
          LANG="${{ steps.meta.outputs.language }}"
          mkdir -p /tmp/smoke-bin

          cd tools
          if [ ! -f go.mod ]; then
            printf "module tools\n\ngo 1.23\n" > go.mod
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/smoke-bin/${TOOL} ./${TOOL}
          cd ..
          chmod +x /tmp/smoke-bin/${TOOL}

          echo "Executing ${TOOL} --help sanity check..."
          HELP_OUTPUT=$(/tmp/smoke-bin/${TOOL} --help 2>&1 || true)
          echo "$HELP_OUTPUT"
          if ! echo "$HELP_OUTPUT" | grep -iqE '(usage:|commands:|options:)'; then
            echo "::error::Smoke test failed: '${TOOL} --help' did not output usage information."
            exit 1
          fi

          echo "Validating core subcommand execution..."
          if [ "${LANG}" = "rust" ]; then
            /tmp/smoke-bin/${TOOL} compile --help 2>&1 | grep -iq "crate-name" || { echo "::error::please_rust compile --help failed"; exit 1; }
          elif [ "${LANG}" = "kotlin" ]; then
            /tmp/smoke-bin/${TOOL} testrunner --help 2>&1 | grep -iq "test-class" || { echo "::error::please_kotlin testrunner --help failed"; exit 1; }
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/smoke-bin/please_kotlin_wasm ./please_kotlin_wasm
            chmod +x /tmp/smoke-bin/please_kotlin_wasm
            /tmp/smoke-bin/please_kotlin_wasm --help 2>&1 | grep -iq "kotlinc-wasm" || { echo "::error::please_kotlin_wasm --help failed"; exit 1; }
          elif [ "${LANG}" = "swift" ]; then
            /tmp/smoke-bin/${TOOL} compile --help 2>&1 | grep -iq "sources" || { echo "::error::please_swift compile --help failed"; exit 1; }
          elif [ "${LANG}" = "ts" ]; then
            /tmp/smoke-bin/${TOOL} compile --help 2>&1 | grep -iq "sources" || { echo "::error::please_ts compile --help failed"; exit 1; }
          elif [ "${LANG}" = "wit" ]; then
            /tmp/smoke-bin/${TOOL} generate --help 2>&1 | grep -iq "lang" || { echo "::error::please_wit generate --help failed"; exit 1; }
          fi

      - name: End-to-end compile validation
        if: steps.meta.outputs.skip != 'true'
        run: |
          LANG="${{ steps.meta.outputs.language }}"
          if [ -d "test/${LANG}" ]; then
            echo "Running end-to-end compile validation for ${LANG}..."
            ./pleasew --plain_output build //test/${LANG}/...
          else
            echo "No test/${LANG} directory found; skipping end-to-end target build."
          fi
        env:
          VERITAS_NO_HOOK: "1"

  build:
    name: Build (${{ matrix.os }}_${{ matrix.arch }})
    needs: validate
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.checkout_ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Compile static Go binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          TOOL: ${{ needs.validate.outputs.tool }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          BINARY_NAME="${TOOL}-${VERSION}-${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p dist
          cd tools
          if [ ! -f go.mod ]; then
            printf "module tools\n\ngo 1.23\n" > go.mod
          fi
          go build -trimpath -ldflags="-s -w" -o "../dist/${BINARY_NAME}" "./${TOOL}"
          if [ "${{ needs.validate.outputs.language }}" = "kotlin" ]; then
            WASM_BINARY_NAME="please_kotlin_wasm-${VERSION}-${{ matrix.os }}_${{ matrix.arch }}"
            go build -trimpath -ldflags="-s -w" -o "../dist/${WASM_BINARY_NAME}" "./please_kotlin_wasm"
            chmod +x "../dist/${WASM_BINARY_NAME}"
          fi
          cd ..
          chmod +x "dist/${BINARY_NAME}"
          ls -lh "dist/${BINARY_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release & Assets
    needs: [validate, build]
    if: needs.validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.target_branch }}
          fetch-depth: 0

      - name: Download all built binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        id: checksums
        env:
          TOOL: ${{ needs.validate.outputs.tool }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd dist
          sha256sum * > checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt

          echo "linux_amd64=$(sha256sum ${TOOL}-${VERSION}-linux_amd64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum ${TOOL}-${VERSION}-linux_arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(sha256sum ${TOOL}-${VERSION}-darwin_amd64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "darwin_arm64=$(sha256sum ${TOOL}-${VERSION}-darwin_arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

          if [ -f "please_kotlin_wasm-${VERSION}-linux_amd64" ]; then
            echo "wasm_linux_amd64=$(sha256sum please_kotlin_wasm-${VERSION}-linux_amd64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "wasm_linux_arm64=$(sha256sum please_kotlin_wasm-${VERSION}-linux_arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "wasm_darwin_amd64=$(sha256sum please_kotlin_wasm-${VERSION}-darwin_amd64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "wasm_darwin_arm64=$(sha256sum please_kotlin_wasm-${VERSION}-darwin_arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi

      - name:
          Update VERSION and tools/BUILD with real hashes (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          LINUX_AMD64: ${{ steps.checksums.outputs.linux_amd64 }}
          LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
          DARWIN_AMD64: ${{ steps.checksums.outputs.darwin_amd64 }}
          DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          WASM_LINUX_AMD64: ${{ steps.checksums.outputs.wasm_linux_amd64 }}
          WASM_LINUX_ARM64: ${{ steps.checksums.outputs.wasm_linux_arm64 }}
          WASM_DARWIN_AMD64: ${{ steps.checksums.outputs.wasm_darwin_amd64 }}
          WASM_DARWIN_ARM64: ${{ steps.checksums.outputs.wasm_darwin_arm64 }}
        run: |
          echo "${VERSION}" > VERSION

          python3 -c '
          import os, re
          version = os.environ["VERSION"]
          linux_amd64 = os.environ["LINUX_AMD64"]
          linux_arm64 = os.environ["LINUX_ARM64"]
          darwin_amd64 = os.environ["DARWIN_AMD64"]
          darwin_arm64 = os.environ["DARWIN_ARM64"]

          file_path = "tools/BUILD"
          with open(file_path, "r") as f:
              content = f.read()

          content = re.sub(r"_VERSION\s*=\s*\"[^\"]+\"", f"_VERSION = \"{version}\"", content)
          hashes_block = f"""hashes = [
              "{linux_amd64}",  # linux_amd64
              "{linux_arm64}",  # linux_arm64
              "{darwin_amd64}",  # darwin_amd64
              "{darwin_arm64}",  # darwin_arm64
          ],"""

          # If WASM hashes exist, update please_kotlin and please_kotlin_wasm blocks individually
          wasm_linux_amd64 = os.environ.get("WASM_LINUX_AMD64")
          if wasm_linux_amd64:
              wasm_linux_arm64 = os.environ["WASM_LINUX_ARM64"]
              wasm_darwin_amd64 = os.environ["WASM_DARWIN_AMD64"]
              wasm_darwin_arm64 = os.environ["WASM_DARWIN_ARM64"]
              wasm_hashes_block = f"""hashes = [
              "{wasm_linux_amd64}",  # linux_amd64
              "{wasm_linux_arm64}",  # linux_arm64
              "{wasm_darwin_amd64}",  # darwin_amd64
              "{wasm_darwin_arm64}",  # darwin_arm64
          ],"""
              pattern = r"(name\s*=\s*\"please_kotlin\",[\s\S]*?hashes\s*=\s*\[)[^\]]+(\],)"
              content = re.sub(pattern, lambda m: m.group(1) + f"""
              "{linux_amd64}",  # linux_amd64
              "{linux_arm64}",  # linux_arm64
              "{darwin_amd64}",  # darwin_amd64
              "{darwin_arm64}",  # darwin_arm64\n          """ + m.group(2), content)

              pattern_wasm = r"(name\s*=\s*\"please_kotlin_wasm\",[\s\S]*?hashes\s*=\s*\[)[^\]]+(\],)"
              content = re.sub(pattern_wasm, lambda m: m.group(1) + f"""
              "{wasm_linux_amd64}",  # linux_amd64
              "{wasm_linux_arm64}",  # linux_arm64
              "{wasm_darwin_amd64}",  # darwin_amd64
              "{wasm_darwin_arm64}",  # darwin_arm64\n          """ + m.group(2), content)
          else:
              content = re.sub(r"hashes\s*=\s*\[[^\]]+\]\s*,?", hashes_block, content)

          with open(file_path, "w") as f:
              f.write(content)
          '

          echo "Diff of updated release files:"
          git diff VERSION tools/BUILD

      - name: Commit, push, and tag release (workflow_dispatch)
        if:
          github.event_name == 'workflow_dispatch' &&
          needs.validate.outputs.dry_run != 'true'
        env:
          LANG: ${{ needs.validate.outputs.language }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION tools/BUILD
          if git diff --staged --quiet; then
            echo "No changes in VERSION or tools/BUILD to commit."
          else
            git commit -m "chore(${LANG}): prepare release v${VERSION} [skip ci]"
            git pull --rebase origin "${LANG}"
            git push origin "${LANG}"
          fi

          echo "Creating tag ${TAG}..."
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Dry Run Summary
        if: needs.validate.outputs.dry_run == 'true'
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          TITLE: ${{ needs.validate.outputs.title }}
          VERSION: ${{ needs.validate.outputs.version }}
          LANG: ${{ needs.validate.outputs.language }}
        run: |
          echo "=== DRY RUN SUMMARY ==="
          echo "Tag:           ${TAG}"
          echo "Title:         [${TITLE}] v${VERSION}"
          echo "Target Branch: ${LANG}"
          echo "Assets:"
          ls -lh dist/
          echo "All checks and binary builds succeeded. No commit, tag, or release was published."

      - name: Upload release assets
        if: needs.validate.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          TITLE: ${{ needs.validate.outputs.title }}
          VERSION: ${{ needs.validate.outputs.version }}
          LANG: ${{ needs.validate.outputs.language }}
        working-directory: dist
        run: |
          # Generate clean release notes using scripts/generate_release_notes.py
          python3 ../scripts/generate_release_notes.py \
            --changelog ../CHANGELOG.md \
            --version "${VERSION}" \
            --title "${TITLE}" \
            --out /tmp/release_notes.md

          FILES=(*)
          echo "Release assets to attach:"
          printf '  %s\n' "${FILES[@]}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release '${TAG}' exists. Updating release notes and uploading/clobbering assets..."
            gh release edit "${TAG}" --title "[${TITLE}] v${VERSION}" --notes-file /tmp/release_notes.md
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            echo "Release '${TAG}' does not exist. Creating release with assets..."
            gh release create "${TAG}" "${FILES[@]}" \
              --title "[${TITLE}] v${VERSION}" \
              --target "${LANG}" \
              --notes-file /tmp/release_notes.md
          fi
