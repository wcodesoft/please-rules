name: CI (Rust)

on:
  push:
    branches: ["rust", "release/rust*"]
  pull_request:
    branches: ["rust", "release/rust*"]

jobs:
  fmt:
    name: Rust & Docs Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check formatting
        uses: ./.github/actions/format-check

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          if [ -d test ]; then
            find test -name "*.rs" -exec rustfmt --check {} +
          fi

  test:
    name: Please Build & Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and test
        uses: ./.github/actions/please-build-test
        with:
          build-targets: //tools/please_rust/... //tools/rust_toolchain/... //test/rust/...

      - name: Coverage smoke test (lib_test)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover //test/rust/lib:lib_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck -coverage-json plz-out/log/coverage.json -covered test/rust/lib/lib.rs

      - name: Raw lcov export smoke test (functions and branches)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover --rerun //test/rust/branches:branches_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck \
            -lcov plz-out/bin/test/rust/branches/branches_test.lcov \
            -path test/rust/branches/branches.rs \
            -line 12=partial -line 5=uncovered \
            -function unused=missed -function classify=2
