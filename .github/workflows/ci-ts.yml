name: CI (TypeScript)

on:
  push:
    branches: ["ts", "release/ts*"]
  pull_request:
    branches: ["ts", "release/ts*"]

jobs:
  fmt:
    name: TypeScript, Go & Docs Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Check Go formatting
        run: |
          if [ -d tools ]; then
            UNFORMATTED=$(gofmt -l tools/)
            if [ -n "$UNFORMATTED" ]; then
              echo "The following Go files are not formatted:"
              echo "$UNFORMATTED"
              echo "Run 'gofmt -w tools/' to fix."
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Check Markdown formatting
        run: npx prettier --check "**/*.md"

  test:
    name: Please Build & Test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build targets
        run: ./pleasew --plain_output build //tools/please_ts/... //tools/ts_toolchain/... //test/ts/...

      - name: Run all tests
        run: ./pleasew --plain_output test //...

      - name: Coverage smoke test (calculator_test)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover //test/ts/lib:calculator_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck -coverage-json plz-out/log/coverage.json -covered test/ts/lib/calculator.ts

      - name: Coverage smoke test (calculator_vitest_test)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover //test/ts/lib:calculator_vitest_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck -coverage-json plz-out/log/coverage.json -covered test/ts/lib/calculator.ts

      - name: Raw lcov export smoke test (functions and branches)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover --rerun //test/ts/lib:branches_test //test/ts/lib:branches_vitest_test
          for t in branches_test branches_vitest_test; do
            echo "Checking $t"
            plz-out/bin/tools/common/lcovcheck/lcovcheck \
              -lcov "plz-out/bin/test/ts/lib/$t.lcov" \
              -path test/ts/lib/branches.ts \
              -line 4=partial -line 5=uncovered \
              -function unused=missed -function classify=2
          done
