name: CI (Main)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    name: Gitflow Branch Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify no language-specific changes target main
        run: |
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files in PR:"
          echo "$CHANGED_FILES"

          # Detect language-specific rules, tools, or integration tests
          VIOLATIONS=""
          while IFS= read -r file; do
            case "$file" in
              build_defs/*|tools/please_*|test/*) VIOLATIONS="${VIOLATIONS}${file}"$'\n' ;;
            esac
          done <<< "$CHANGED_FILES"
          VIOLATIONS="${VIOLATIONS%$'\n'}"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Language-specific rules or tests cannot be merged into 'main'."
            echo "The following files violate the Hub-and-Spoke Gitflow:"
            echo "$VIOLATIONS"
            echo "Please retarget your PR to the corresponding language branch (e.g. 'rust' or 'kotlin')."
            exit 1
          fi

  fmt:
    name: Code & Docs Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check formatting
        uses: ./.github/actions/format-check

  test:
    name: Please Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and test
        uses: ./.github/actions/please-build-test
