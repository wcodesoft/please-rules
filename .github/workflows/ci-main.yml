name: CI (Main)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    name: Gitflow Branch Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify no language-specific changes target main
        run: |
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files in PR:"
          echo "$CHANGED_FILES"

          # Detect language-specific rules, tools, or integration tests
          VIOLATIONS=$(echo "$CHANGED_FILES" | grep -E '^(build_defs/[^/]+|tools/please_[^/]+|test/[^/]+)' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Language-specific rules or tests cannot be merged into 'main'."
            echo "The following files violate the Hub-and-Spoke Gitflow:"
            echo "$VIOLATIONS"
            echo "Please retarget your PR to the corresponding language branch (e.g. 'rust' or 'kotlin')."
            exit 1
          fi

  fmt:
    name: Code & Docs Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Check Go formatting
        run: |
          if [ -d tools ]; then
            UNFORMATTED=$(gofmt -l tools/)
            if [ -n "$UNFORMATTED" ]; then
              echo "The following Go files are not formatted:"
              echo "$UNFORMATTED"
              echo "Run 'gofmt -w tools/' to fix."
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Check Markdown formatting
        run: npx prettier --check "**/*.md"

  test:
    name: Please Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build all targets
        run: ./pleasew --plain_output build //...
        env:
          VERITAS_NO_HOOK: "1"

      - name: Run all tests
        run: ./pleasew --plain_output test //...
        env:
          VERITAS_NO_HOOK: "1"
