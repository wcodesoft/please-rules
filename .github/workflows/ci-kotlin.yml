name: CI (Kotlin)

on:
  push:
    branches: ["kotlin", "release/kotlin*"]
  pull_request:
    branches: ["kotlin", "release/kotlin*"]

jobs:
  fmt:
    name: Kotlin & Docs Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Check Go formatting
        run: |
          if [ -d tools ]; then
            UNFORMATTED=$(gofmt -l tools/)
            if [ -n "$UNFORMATTED" ]; then
              echo "The following Go files are not formatted:"
              echo "$UNFORMATTED"
              echo "Run 'gofmt -w tools/' to fix."
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Check Markdown formatting
        run: npx prettier --check "**/*.md"

  test:
    name: Please Build & Test (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build all targets
        run: ./pleasew --plain_output build //tools/please_kotlin/... //tools/kotlin_toolchain/... //test/kotlin/...
        env:
          VERITAS_NO_HOOK: "1"

      - name: Run all tests
        run: ./pleasew --plain_output test //...
        env:
          VERITAS_NO_HOOK: "1"

      - name: Coverage smoke test (lib_test)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover //test/kotlin/lib:lib_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck -coverage-json plz-out/log/coverage.json -covered test/kotlin/lib/lib.kt
        env:
          VERITAS_NO_HOOK: "1"

      - name: Raw lcov export smoke test (functions and branches)
        run: |
          ./pleasew --plain_output build //tools/common/lcovcheck
          ./pleasew --plain_output cover --rerun //test/kotlin/branches:branches_test
          plz-out/bin/tools/common/lcovcheck/lcovcheck \
            -lcov plz-out/bin/test/kotlin/branches/branches_test.lcov \
            -path test/kotlin/branches/branches.kt \
            -line 6=partial -line 7=uncovered \
            -function 'unused()I=missed' -function classify=hit
        env:
          VERITAS_NO_HOOK: "1"
