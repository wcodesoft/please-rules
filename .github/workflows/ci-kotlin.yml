name: CI (Kotlin)

on:
  push:
    branches: ["kotlin", "release/kotlin*"]
  pull_request:
    branches: ["kotlin", "release/kotlin*"]

jobs:
  fmt:
    name: Kotlin & Docs Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Check Go formatting
        run: |
          if [ -d tools ]; then
            UNFORMATTED=$(gofmt -l tools/)
            if [ -n "$UNFORMATTED" ]; then
              echo "The following Go files are not formatted:"
              echo "$UNFORMATTED"
              echo "Run 'gofmt -w tools/' to fix."
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Check Markdown formatting
        run: npx prettier --check "**/*.md"

  test:
    name: Please Build & Test (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build all targets
        run: ./pleasew --plain_output build //tools/please_kotlin/... //tools/kotlin_toolchain/... //test/kotlin/...
        env:
          VERITAS_NO_HOOK: "1"

      - name: Run all tests
        run: ./pleasew --plain_output test //...
        env:
          VERITAS_NO_HOOK: "1"

      - name: Coverage smoke test (lib_test)
        run: |
          ./pleasew --plain_output cover //test/kotlin/lib:lib_test  2>&1 | tee cover.log
          grep -Eq '^\s+lib\.kt [1-9][0-9]*/' cover.log
        env:
          VERITAS_NO_HOOK: "1"

      - name: Raw lcov export smoke test (functions and branches)
        run: |
          ./pleasew --plain_output cover //test/kotlin/branches:branches_test 2>&1 | tee cover.log
          f="plz-out/bin/test/kotlin/branches/branches_test.lcov"
          grep -q '^SF:test/kotlin/branches/branches\.kt$' "$f"
          grep -Eq '^FNDA:0,.*\.unused\(\)I$' "$f"
          grep -q '^BRDA:6,0,1,0$' "$f"
        env:
          VERITAS_NO_HOOK: "1"
